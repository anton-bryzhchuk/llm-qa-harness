name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit + mock suites (pytest)
        # The @live marker is deselected so CI never needs an API key.
        run: pytest -q -m "not live"

      - name: Demo -- prove the harness detects injected failures
        run: python -m llmqa demo-failures
